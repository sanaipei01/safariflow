<div class="app">
  <header class="top">
    <a class="logo" routerLink="/passenger">
      <span class="logo-mark" aria-hidden="true"><i class="pi pi-car"></i></span>
      <span class="logo-text">Safari<span>Flow</span></span>
    </a>
    <div class="top-end">
      <span class="pill">Passenger</span>
      <button type="button" class="logout" aria-label="Log out" (click)="auth.logout()">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>

  <nav class="tabs" aria-label="Passenger">
    @for (tab of tabs; track tab.url) {
      <a [routerLink]="tab.url" routerLinkActive="active" [routerLinkActiveOptions]="activeOptions">
        <i class="pi" [class]="tab.icon" aria-hidden="true"></i>
        <span>{{ tab.label }}</span>
      </a>
    }
  </nav>
</div>
