<header class="user-bar">
  <div class="brand">
    <strong>SafariFlow</strong>
    <span class="area">{{ area() }}</span>
  </div>
  @if (auth.user(); as user) {
    <div class="session">
      <span>{{ user.name }} ({{ user.role }})</span>
      <p-button
        label="Log out"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="auth.logout()"
      />
    </div>
  }
</header>
